<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiX AI Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6">

    <div class="w-full max-w-2xl bg-gray-800 rounded-lg p-6 shadow-lg border border-gray-700">
        <h1 class="text-2xl font-bold text-indigo-400 mb-4 text-center">MiX AI Backend Interface</h1>
        
        <!-- Input Box -->
        <label class="block text-sm font-medium mb-2 text-gray-300">Enter Prompt:</label>
        <textarea id="prompt" rows="4" class="w-full p-3 rounded-md bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-indigo-500" placeholder="Type your message here..."></textarea>
        
        <!-- Submit Button -->
        <button onclick="sendPrompt()" id="submit-btn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-md transition duration-200">
            Send Request
        </button>

        <!-- Response Area -->
        <div class="mt-6">
            <h2 class="text-lg font-semibold text-gray-300 mb-2">Response:</h2>
            <div id="response" class="p-4 bg-gray-950 text-emerald-400 rounded-md border border-gray-800 min-h-[100px] whitespace-pre-wrap">
                Waiting for input...
            </div>
        </div>
    </div>

    <script>
        async function sendPrompt() {
            const promptText = document.getElementById("prompt").value;
            const responseDiv = document.getElementById("response");
            const submitBtn = document.getElementById("submit-btn");

            if (!promptText.trim()) {
                alert("Please enter a prompt!");
                return;
            }

            responseDiv.innerText = "Generating response...";
            submitBtn.disabled = true;

            try {
                // Codespaces/Render Backend URL
                const res = await fetch("https://zany-sniffle-4j4j9qg64xrj375px-8081.app.github.dev/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ prompt: promptText })
                });

                const data = await res.json();
                responseDiv.innerText = data.response || data.data[0] || "No response received.";
            } catch (error) {
                responseDiv.innerText = "Error: " + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
