<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiX AI Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6">

    <div class="w-full max-w-2xl bg-gray-800 rounded-lg p-6 shadow-lg border border-gray-700">
        <h1 class="text-2xl font-bold text-indigo-400 mb-4 text-center">MiX AI Engine</h1>
        
        <label class="block text-sm font-medium mb-2 text-gray-300">Enter Prompt:</label>
        <textarea id="prompt" rows="4" class="w-full p-3 rounded-md bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-indigo-500" placeholder="Type your prompt here..."></textarea>
        
        <button onclick="sendPrompt()" id="submit-btn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-md transition duration-200">
            Send Prompt
        </button>

        <div class="mt-6">
            <h2 class="text-lg font-semibold text-gray-300 mb-2">Response:</h2>
            <div id="response" class="p-4 bg-gray-950 text-emerald-400 rounded-md border border-gray-800 min-h-[100px] whitespace-pre-wrap">
                Waiting for input...
            </div>
        </div>
    </div>

    <script>
        async function sendPrompt() {
            const promptText = document.getElementById("prompt").value;
            const responseDiv = document.getElementById("response");
            const submitBtn = document.getElementById("submit-btn");

            if (!promptText.trim()) {
                alert("Please enter a prompt!");
                return;
            }

            responseDiv.innerText = "Generating response via OpenRouter...";
            submitBtn.disabled = true;

            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer 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",
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://mi-xcom-ai-owened.vercel.app",
                        "X-Title": "MiX AI Engine"
                    },
                    body: JSON.stringify({
                        "model": "inclusionai/ling-3.0-flash-vl:free",
                        "messages": [
                            {
                                "role": "user",
                                "content": promptText
                            }
                        ]
                    })
                });

                const data = await res.json();

                if (data.choices && data.choices.length > 0) {
                    responseDiv.innerText = data.choices[0].message.content;
                } else if (data.error) {
                    responseDiv.innerText = "API Error: " + data.error.message;
                } else {
                    responseDiv.innerText = "No response received.";
                }
            } catch (error) {
                responseDiv.innerText = "Fetch Error: " + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
